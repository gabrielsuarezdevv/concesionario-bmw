spring.application.name=bmw-atelier
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/atelier;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.port=${PORT:8080}
atelier.checkout.public-url=${CHECKOUT_PUBLIC_URL:}
atelier.mail.mode=${ORDER_MAIL_MODE:preview}
atelier.mail.from=${ORDER_MAIL_FROM:pedidos@bmw-atelier.test}
atelier.mail.preview-directory=${ORDER_MAIL_PREVIEW_DIRECTORY:./data/mail-preview}
atelier.mail.dispatch-enabled=${ORDER_MAIL_DISPATCH_ENABLED:true}
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=${SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.ssl.enable]=${SMTP_SSL:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.jackson.deserialization.accept-float-as-int=false
